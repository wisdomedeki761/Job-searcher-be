# PostgreSQL for local development.
# Usage: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: aj-scraper-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aj_scraper
    ports:
      - "5432:5432"
    volumes:
      - aj_scraper_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aj_scraper"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  aj_scraper_pgdata:
